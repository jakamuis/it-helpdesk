<VirtualHost *:80>
    DocumentRoot /var/www/glpi/public

    RewriteEngine On
    # Only the bare homepage changes; GLPI login query strings stay available.
    RewriteCond %{QUERY_STRING} ^$
    RewriteRule ^/?$ /plugins/layananit/front/index.php [R=302,L]
    RewriteRule ^/?front/?$ /front/central.php?legacy=1 [R=302,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /var/www/glpi/public>
        Require all granted

        RewriteEngine On

        # Prevent bearer authorization token filtering
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Redirect all requests to GLPI router, unless file exists.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
</VirtualHost>
