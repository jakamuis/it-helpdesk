services:
  # Compose file-backed secrets are bind-mounted with host ownership, so they
  # cannot be read reliably by the runtime UID 10001. This one-shot service
  # validates and stages a private copy without ever joining a network.
  asset-sync-credentials-init:
    image: python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
    platform: ${ASSET_SYNC_PLATFORM:-linux/amd64}
    user: "0:0"
    network_mode: "none"
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      # Linux file-backed secrets retain host ownership; this allows read-only
      # traversal/read of a 0600 source owned by the deployment user.
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: volume
        source: asset-sync-credentials
        target: /staged
    secrets:
      - source: google_service_account
        target: google-service-account.json
        mode: 0400
    command:
      - /bin/sh
      - -euc
      - |
        python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); required=("client_email","private_key","token_uri"); valid=isinstance(d,dict) and d.get("type")=="service_account" and all(isinstance(d.get(key),str) and d[key].strip() for key in required); raise SystemExit(0 if valid else "invalid Google service-account JSON")' /run/secrets/google-service-account.json
        umask 077
        chmod 0711 /staged
        temp_path="$$(mktemp /staged/.google-service-account.json.tmp.XXXXXX)"
        trap 'rm -f "$$temp_path"' EXIT
        cp /run/secrets/google-service-account.json "$$temp_path"
        chmod 0400 "$$temp_path"
        chown 10001:10001 "$$temp_path"
        mv -f "$$temp_path" /staged/google-service-account.json
        trap - EXIT

  asset-sync:
    build:
      context: .
      args:
        BUILD_COMMIT: ${ASSET_SYNC_BUILD_COMMIT:-unknown}
    image: asset-sync:${ASSET_SYNC_IMAGE_TAG:-1.1.0-local}
    platform: ${ASSET_SYNC_PLATFORM:-linux/amd64}
    depends_on:
      asset-sync-credentials-init:
        condition: service_completed_successfully
        restart: true
    ports:
      - "127.0.0.1:8555:8000"
    volumes:
      - asset-sync-data:/app/data
      - type: volume
        source: asset-sync-credentials
        target: /app/secrets
        read_only: true
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      GOOGLE_CREDENTIALS_PATH: /app/secrets/google-service-account.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Keep the certificate-valid GLPI hostname on the server's local path.
      # Apache serves a wildcard certificate valid for this name.
      - "glpi.samator.com:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)); sys.exit(0 if d.get('status') == 'ok' and d.get('database_connectivity') and d.get('glpi_connectivity') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command:
      - /bin/sh
      - -euc
      - |
        python -c 'import os,stat,sys; p="/app/secrets/google-service-account.json"; s=os.lstat(p); valid=stat.S_ISREG(s.st_mode) and s.st_uid==os.getuid()==10001 and s.st_gid==os.getgid()==10001 and stat.S_IMODE(s.st_mode)==0o400; raise SystemExit(0 if valid else "unsafe Google credential permissions")'
        umask 077
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  asset-sync-data:
  asset-sync-credentials:

secrets:
  google_service_account:
    file: ./data/service_account.json
